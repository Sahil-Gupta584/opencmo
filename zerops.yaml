zerops:
  - setup: nodejs
    build:
      base: nodejs@22
      os: ubuntu
      buildCommands:
        - npm install
        - npm run db:generate
        - npm run build --workspace=api
      deployFiles:
        - apps/api/dist
        - apps/api/package.json
        - package.json
        - package-lock.json
        - node_modules
        - packages
      cache:
        - node_modules
    run:
      base: nodejs@22
      os: ubuntu
      ports:
        - port: 5001
          httpSupport: true
      start: npm run start --workspace=api
      healthCheck:
        httpGet:
          port: 5001
          path: /health
      envVariables:
        NODE_ENV: production
        PORT: "5001"
        API_URL: "http://localhost:5001"
      crontab:
        - command: "node apps/api/dist/cron/fetch-inbounds.js"
          timing: "0 */11 * * *"
        - command: "node apps/api/dist/cron/generate-daily-content.js"
          timing: "0 6 * * *"
